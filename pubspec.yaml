name: applytrack
description: "ApplyTrack — track job and internship applications: pipeline, deadlines, interviews, stats. Local-first, no accounts, no demo data."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path: ^1.9.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
